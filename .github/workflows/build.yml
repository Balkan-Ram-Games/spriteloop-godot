name: Build

# Builds the extension for every platform from the prebuilt SDK libraries in
# sdk/lib/ and packages the addon zip (a run artifact).
#
# Started by hand from the Actions tab; pushes do not run it. To release, fill
# in "release": after the builds pass, the run creates that tag on
# the commit it built and a GitHub release with the addon zip attached.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to create, e.g. v0.1.0-alpha (empty: build only)"
        required: false
        default: ""

env:
  # godot-cpp 4.5 defaults (tools/android.py, CI Emscripten version).
  ANDROID_NDK_VERSION: "28.1.13356709"
  EMSCRIPTEN_VERSION: "4.0.11"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows.x86_64, os: windows-latest, platform: windows, arch: x86_64 }
          - { name: linux.x86_64, os: ubuntu-22.04, platform: linux, arch: x86_64 }
          - { name: macos.universal, os: macos-15, platform: macos, arch: universal }
          - { name: ios.arm64, os: macos-15, platform: ios, arch: arm64 }
          - { name: android.arm64, os: ubuntu-22.04, platform: android, arch: arm64 }
          - { name: android.arm32, os: ubuntu-22.04, platform: android, arch: arm32 }
          - { name: android.x86_64, os: ubuntu-22.04, platform: android, arch: x86_64 }
          - { name: web.wasm32, os: ubuntu-22.04, platform: web, arch: wasm32, threads: "yes" }
          - { name: web.wasm32.nothreads, os: ubuntu-22.04, platform: web, arch: wasm32, threads: "no" }

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install scons

      - name: Cache key
        # One cache per target and godot-cpp version (godot-cpp is most of the
        # build). A key per commit saved ~9 large caches every run, and GitHub's
        # 10 GB repository limit evicted them before the next run.
        id: cache-key
        shell: bash
        # The runner image version changes with its compilers, which SCons
        # treats as inputs; a new image starts a new cache.
        run: |
          echo "godot_cpp=$(git rev-parse HEAD:godot-cpp)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ matrix.name }}-${{ steps.cache-key.outputs.image }}-${{ steps.cache-key.outputs.godot_cpp }}-${{ hashFiles('SConstruct') }}

      - name: Set up Emscripten
        if: matrix.platform == 'web'
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - name: Install Android NDK
        if: matrix.platform == 'android'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null

      - name: Build
        shell: bash
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          options="platform=${{ matrix.platform }} arch=${{ matrix.arch }}"
          if [ -n "${{ matrix.threads }}" ]; then options="$options threads=${{ matrix.threads }}"; fi
          scons $options target=template_debug -j4
          scons $options target=template_release -j4

      - name: Upload libraries
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.name }}
          path: addons/spriteloop/bin/libspriteloop.*
          if-no-files-found: error

  package:
    name: Package addon
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download libraries
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: addons/spriteloop/bin
          merge-multiple: true

      - name: Create addon zip
        # The icon .import files are included: they make the editor scale and
        # theme the node icons.
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          name="spriteloop-godot-${RELEASE:-$(git rev-parse --short HEAD)}"
          echo "ADDON_NAME=$name" >> "$GITHUB_ENV"
          mkdir -p dist
          cp README.md addons/spriteloop/
          zip -r "dist/$name.zip" addons/spriteloop
          unzip -l "dist/$name.zip"

      - name: Upload addon
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ADDON_NAME }}
          path: dist/${{ env.ADDON_NAME }}.zip
          if-no-files-found: error

      - name: Publish release
        # Creates the tag on the built commit. A tag with a "-" (v0.1.0-alpha)
        # is marked as a prerelease.
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          prerelease=""
          case "$RELEASE" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$RELEASE" "dist/$ADDON_NAME.zip" --target "$GITHUB_SHA" \
            --title "$RELEASE" --generate-notes $prerelease
